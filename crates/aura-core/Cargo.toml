aura-tool-scheduler = { path = "../aura-tool-scheduler" }
aura-tool-runtime = { path = "../aura-tool-runtime" }
aura-windows-platform = { path = "../aura-windows-platform" }
aura-workspace = { path = "../aura-workspace" }
blake3.workspace = true
base64.workspace = true
getrandom.workspace = true
flate2 = { workspace = true, optional = true }
regex.workspace = true
resvg.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rusqlite = { workspace = true, optional = true }
tempfile.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26.4", optional = true }
thiserror.workspace = true
time.workspace = true
url.workspace = true
zeroize.workspace = true
zip.workspace = true

[dev-dependencies]
junction.workspace = true
# Test-only: hold one file's real scan open, so the IPC lifecycle tests drive the
# real search worker through a real disconnect instead of a stand-in. The feature
# exists only in `aura-fs-tools`; no product build enables it.
aura-fs-tools = { path = "../aura-fs-tools", features = ["search-test-faults"] }
aura-contract-schema = { path = "../aura-contract-schema" }
aura-context-fixtures = { path = "../aura-context-fixtures" }
aura-network-control = { path = "../aura-network-control", features = ["test-fixture-tls", "test-fixture-dns"] }
aura-sandbox-host = { path = "../aura-sandbox-host" }
flate2.workspace = true
rusqlite.workspace = true
tokio-rustls = "0.26.4"

[lints]
workspace = true
